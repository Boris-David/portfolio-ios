name: Amissan

# ─────────────────────────────────────────────────────────────────────────────
# The Xcode project is GENERATED from this file, and is not committed.
#
# An `.xcodeproj` is a near-binary format where every added file produces three
# lines of opaque identifiers. Two branches each adding a screen produce a merge
# conflict nobody can read, and that gets resolved by overwriting someone's work.
#
# Here, adding a file requires nothing: sources are declared by directory. And
# the project configuration — targets, settings, capabilities — reads as text,
# diffs in a pull request, and can be commented.
#
#   xcodegen generate     regenerates Amissan.xcodeproj
# ─────────────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: dev.amissan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # Schemes are generated from here: committing `.xcscheme` files means
  # committing an artefact, with the same conflicts as the project itself.
  xcodeVersion: "26.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # A warning you tolerate is a warning you stop reading. On a repository
    # recruiters open, the bar is zero.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
    ENABLE_MODULE_VERIFIER: true

packages:
  # One package per layer, and the boundary is the manifest.
  #
  # A target can see a sibling's `public` types the moment somebody adds a line
  # to the manifest — one line, and the layering is gone. A package cannot reach
  # what it does not declare: `Features/Package.swift` never names `Networking`,
  # so `import Networking` in a screen is not a review comment, it is
  # "no such module".
  #
  # The application target declares all of these, because it **is** the
  # composition root — the ring nothing imports. That is not a widening of what
  # a screen can reach: `Features/Package.swift` still does not name
  # `Networking`, `Core` or `Data`.
  #
  # ⚠️ Every package is listed here even though the app names one. A package
  # left out still builds — it is reached transitively — but Xcode never
  # surfaces its test target, so `xcodebuild test -scheme CoreUITests` answers
  # "no such scheme" and the suite silently stops running. Found exactly that
  # way, on a package added an hour earlier.
  Domain:
    path: Packages/Domain
  Networking:
    path: Packages/Networking
  Core:
    path: Packages/Core
  Data:
    path: Packages/Data
  Presentation:
    path: Packages/Presentation
  DesignSystem:
    path: Packages/DesignSystem
  Localization:
    path: Packages/Localization
  CoreUI:
    path: Packages/CoreUI
  Features:
    path: Packages/Features

targets:
  Amissan:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    # ─────────────────────────────────────────────────────────────────────
    # The composition root IS this target.
    #
    # It therefore names every layer, because assembling them is the one thing
    # it does. That is not a widening of what a *screen* can reach: a screen
    # lives in `Features`, whose manifest still does not declare `Networking`,
    # `Core` or `Data`.
    #
    # What this target gave up is that it could not previously write
    # `import Networking` at all. `Scripts/check-layers.sh` replaces that with
    # the rule it was standing in for: **no screen here** — no catalogue, no
    # text key, no content. This target wires; it does not draw.
    # ─────────────────────────────────────────────────────────────────────
    dependencies:
      - package: Domain
        product: Domain
      - package: Networking
        product: Networking
      - package: Core
        product: Core
      - package: Localization
        product: Localization
      - package: Data
        product: Data
      - package: Presentation
        product: Presentation
      - package: DesignSystem
        product: DesignSystem
      - package: CoreUI
        product: CoreUI
      - package: Features
        product: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.amissan.portfolio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # The icon is referenced by its asset-catalogue set name.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Portrait only on iPhone: this app is read, and an editorial layout in
        # landscape on a phone adds nothing anyone asked for.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Amissan
        # French is the source's language; English follows the content the API
        # serves.
        INFOPLIST_KEY_CFBundleDevelopmentRegion: fr
        # No camera, no microphone, no location: this app requests **no**
        # permission at all, and the file shows it by what it does not contain.
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ⚠️ Declared explicitly, not left to implicit generation.
        #
        # Without `UILaunchScreen`, iOS runs the app in **compatibility mode**:
        # content renders at a reduced logical size, with black bars top and
        # bottom. Measured on an iPhone 17 Pro: 603 points used out of 874.
        # Nothing warns — not the build, not the runtime — and by eye it looks
        # like a layout bug you then hunt in the wrong place.
        #
        # An empty dictionary is enough: it means "empty launch screen", which
        # is the right choice for an app that shows content on the first frame.
        UILaunchScreen: {}
    entitlements:
      path: App/Amissan.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:amissan.dev

  AmissanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Amissan
    settings:
      base:
        # Tests do not treat warnings as errors: a test that deliberately
        # exercises a deprecated API must be able to.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: false
        # A test bundle must be signed, so it needs an Info.plist. Generating
        # it avoids committing one that would hold nothing but defaults.
        GENERATE_INFOPLIST_FILE: true

schemes:
  # ⚠️ The package suites are **not** listed here, and cannot be.
  #
  # XcodeGen validates a scheme's test targets against the project's own, and a
  # SwiftPM test target is not one — Xcode generates an implicit scheme for each
  # instead, which is what `Scripts/test.sh` drives. Adding them here fails
  # generation outright, which is at least honest about it.
  #
  # So ⌘U runs the app's suites; `./Scripts/test.sh` runs all thirteen, and
  # prints a total per suite — which is what makes a suite that stopped running
  # visible at all. See `check-suites.sh`.
  Amissan:
    build:
      targets:
        Amissan: all
        AmissanTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Amissan
      targets:
        - AmissanTests
    run:
      config: Debug
    archive:
      config: Release
