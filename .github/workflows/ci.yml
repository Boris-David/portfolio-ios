name: CI

# One rule holds this whole file: **whatever is announced as a requirement must
# break the build when it is not met.**
#
# An iOS project has a particular way of lying: it compiles, it launches, and it
# is wrong. Hence guards that check not the code but what the code *claims* —
# that the design artefacts really descend from the tokens, that the bundled seed
# still describes what the API serves, that no layer has gained a forbidden edge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secret is needed: nothing is signed and nothing is published here. A CI that
# needs nothing can leak nothing. Signing lives in `release.yml`, triggered by
# hand.
permissions:
  contents: read

env:
  # The minimum version that ships the iOS 26 SDK, therefore Liquid Glass.
  XCODE_MINIMUM: "26.0"
  SIMULATOR: iPhone 17 Pro

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # The guards that compile nothing — they run in seconds and catch the
  # divergences a compiler would never see.
  # ───────────────────────────────────────────────────────────────────────
  guards:
    name: Artefacts still descend from their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # `Tokens.swift` is generated from the shared tokens plus the iOS-only
      # ones. Editing it by hand gives a design that drifts from the website
      # **with nothing to say so** — and only on the theme nobody opened.
      - name: The design system descends from the tokens
        run: ./Scripts/tokens.mjs --check

      # The bundled seed is a snapshot of the API. A snapshot never confronted
      # with its source becomes a second source of truth.
      - name: The bundled seed still describes what the API serves
        run: ./Scripts/seed.sh --check

      # Icons and screenshots are named by public slug. A slug rendered without
      # its file produces no error: it produces a broken image.
      - name: Every expected asset is present
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          ./Scripts/assets.py --check

      # The repository is public. An employer marker or an indexed key is
      # irreversible.
      - name: No secret, no employer marker
        run: ./Scripts/check-secrets.sh

      # Readership, not style: this repository is opened by people who may not
      # read French, and reasoning they cannot read is reasoning wasted.
      - name: The Swift source is English only
        run: ./Scripts/check-language.sh

      # The package graph holds most of the layering by itself. These two
      # invariants it cannot hold, because SwiftUI ships with the SDK: the
      # domain must not know an interface exists, and the presentation layer
      # must not render.
      - name: No layer sees what it must not
        run: ./Scripts/check-layers.sh

      # The name says the role. A convention nothing executes lasts three weeks.
      - name: Every type wears the suffix of its role
        run: ./Scripts/check-naming.sh

      # A suite that stops running does not fail — it vanishes, and the total at
      # the bottom of the log drops by a number nobody was counting.
      - name: Every test target actually runs
        run: ./Scripts/check-suites.sh

      # Text moved out of Swift and into string catalogues, which bought plurals
      # that follow the language and cost the compile error a missing
      # translation used to be. This is the repayment: a key with no entry now
      # fails here instead of rendering itself on screen.
      - name: Every string is translated, and every key reaches one
        run: ./Scripts/check-strings.sh

  # ───────────────────────────────────────────────────────────────────────
  # Build and test
  # ───────────────────────────────────────────────────────────────────────
  tests:
    name: Build and every test suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # ⚠️ The iOS 26 SDK is not guaranteed on a runner image.
      #
      # Without this step, an older image produces a compile error on
      # `glassEffect` — a message that sends you looking in the code when the
      # problem is in the environment. Say it here, once, plainly.
      - name: Pick the newest Xcode, and require the iOS 26 SDK
        run: |
          set -euo pipefail
          available="$(ls /Applications | grep -E '^Xcode.*\.app$' || true)"
          echo "Installed Xcodes: ${available:-none}"

          best=""
          for app in $available; do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "/Applications/$app/Contents/Info.plist" 2>/dev/null || echo 0)"
            if [ "$(printf '%s\n%s\n' "$XCODE_MINIMUM" "$version" | sort -V | head -1)" = "$XCODE_MINIMUM" ]; then
              best="/Applications/$app"
            fi
          done

          if [ -z "$best" ]; then
            echo "::error::No Xcode >= $XCODE_MINIMUM on this runner."
            # ⚠️ Single quotes on purpose. Backticks inside double quotes are
            # command substitution, so this line used to *run* `glassEffect`
            # before printing the message meant to help.
            echo 'The app builds against the iOS 26 SDK (Liquid Glass) while targeting'
            echo 'iOS 18. Without that SDK the build fails on `glassEffect` — an error'
            echo 'that sends you looking in the wrong place.'
            exit 1
          fi

          sudo xcode-select -s "$best"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The project is not committed: it regenerates. If `project.yml` and the
      # repository had drifted, this is where we would find out.
      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: |
          set -euo pipefail
          name="$(xcrun simctl list devices available | grep -oE '^ +iPhone [0-9]+ Pro' | head -1 | xargs || true)"
          [ -z "$name" ] && name="$(xcrun simctl list devices available | grep -oE '^ +iPhone [^(]+' | head -1 | xargs)"
          echo "Chosen simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Every suite
        run: ./Scripts/test.sh "${{ steps.simulator.outputs.name }}"

      # A Release build is not a Debug build: optimisation, dead-code stripping,
      # and above all **warnings treated as errors** that only surface there.
      - name: Build for Release
        run: |
          xcodebuild build \
            -project Amissan.xcodeproj \
            -scheme Amissan \
            -configuration Release \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -quiet

  # ───────────────────────────────────────────────────────────────────────
  # Backward compatibility, verified rather than asserted
  # ───────────────────────────────────────────────────────────────────────
  backward-compatibility:
    name: The app launches on iOS 18 too
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Pick the newest Xcode
        run: |
          set -euo pipefail
          best=""
          for app in $(ls /Applications | grep -E '^Xcode.*\.app$' || true); do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "/Applications/$app/Contents/Info.plist" 2>/dev/null || echo 0)"
            [ "$(printf '%s\n%s\n' "$XCODE_MINIMUM" "$version" | sort -V | head -1)" = "$XCODE_MINIMUM" ] \
              && best="/Applications/$app"
          done
          [ -n "$best" ] || { echo "::error::No Xcode >= $XCODE_MINIMUM."; exit 1; }
          sudo xcode-select -s "$best"

      - run: brew install xcodegen
      - run: xcodegen generate

      # "The app supports iOS 18" is a claim. This verifies it: the app is
      # installed and actually launched on an iOS 18 runtime, and the job fails
      # if it does not start. The Liquid Glass fallback is exercised, not
      # assumed.
      - name: Install an iOS 18 runtime and launch the app on it
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes available | grep -oE 'iOS 18\.[0-9]+' | head -1 || true)"
          if [ -z "$runtime" ]; then
            echo "::warning::No iOS 18 runtime on this runner — backward compatibility was not exercised."
            exit 0
          fi
          echo "Runtime found: $runtime"

          udid="$(xcrun simctl list devices available --json | python3 -c "
          import json,sys
          for rt, devs in json.load(sys.stdin)['devices'].items():
              if 'iOS-18' in rt and devs: print(devs[0]['udid']); break")"

          xcodebuild build -project Amissan.xcodeproj -scheme Amissan \
            -destination "id=$udid" -quiet

          bundle="$(find ~/Library/Developer/Xcode/DerivedData -name 'Amissan.app' -path '*Debug-iphonesimulator*' | head -1)"
          xcrun simctl boot "$udid" || true
          sleep 10
          xcrun simctl install "$udid" "$bundle"
          xcrun simctl launch "$udid" dev.amissan.portfolio

          # A launch that ends immediately is a crash. Check the process is
          # still there a few seconds later.
          sleep 6
          if ! xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "dev.amissan.portfolio"; then
            echo "::error::The app stopped running after launching on $runtime."
            exit 1
          fi
          echo "The app is running on $runtime."
